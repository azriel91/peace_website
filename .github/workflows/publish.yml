on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

name: Publish

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: "Checkout peace_website repository"
        uses: actions/checkout@v6
        with:
          path: "peace_website"

      - name: "Checkout peace repository"
        uses: actions/checkout@v6
        with:
          repository: "azriel91/peace"
          path: "peace"

      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: "Install `wasm-pack`"
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: "Install Graphviz"
        uses: ts-graphviz/setup-graphviz@v1

      # install mdbook
      - name: mdbook cache restore
        id: mdbook_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook

      # use custom version of mdbook for now
      - name: Install `mdbook`
        run: cargo install mdbook --git https://github.com/azriel91/mdBook.git --branch improvement/code-blocks
        if: steps.mdbook_cache_restore.outputs.cache-hit != 'true'

      - name: mdbook cache save
        id: mdbook_cache_save
        uses: actions/cache/save@v4
        if: always() && steps.mdbook_cache_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook

      # install mdbook-graphviz
      - name: mdbook-graphviz cache restore
        id: mdbook_graphviz_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/mdbook-graphviz
          key: ${{ runner.os }}-mdbook-graphviz

      - run: cargo install --locked mdbook-graphviz
        if: steps.mdbook_graphviz_cache_restore.outputs.cache-hit != 'true'

      - name: mdbook-graphviz cache save
        id: mdbook_graphviz_cache_save
        uses: actions/cache/save@v4
        if: always() && steps.mdbook_graphviz_cache_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/mdbook-graphviz
          key: ${{ runner.os }}-mdbook-graphviz

      # build WASM examples
      #
      # Backtrack 3 layers of directories relative to example dir:
      #
      # * examples
      # * peace (repo)
      # * github agent dir
      - name: "Build WASM examples"
        working-directory: peace
        run: |
          for example in download
          do wasm-pack build \
            --target web \
            --out-dir "../../doc/src/examples/pkg" \
            --release \
            "examples/${example}" \
            --features 'error_reporting'
          done

      # Build and publish book
      #
      # Backtrack 2 layers of directories relative to `doc` directory:
      #
      # * peace (repo)
      # * github agent dir
      - name: Build book
        working-directory: peace
        run: mdbook build doc -d ../../peace_website/static/book

      # We *do* want to include the built wasm files.
      - name: "Remove WASM artifacts .gitignore"
        working-directory: peace_website
        run: rm -f ./static/book/examples/pkg/.gitignore

      - name: "Build zola site"
        uses: shalzz/zola-deploy-action@v0.21.0
        env:
          BUILD_DIR: peace_website
          PAGES_BRANCH: gh-pages
          # Unnecessary for build only
          # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # github's line number anchors aren't explicitly named on the pages
          # causing zola's checks to fail
          #
          CHECK_LINKS: true
          BUILD_ONLY: true

  build_and_publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: "Checkout peace_website repository"
        uses: actions/checkout@v6
        with:
          path: "peace_website"

      - name: "Checkout peace repository"
        uses: actions/checkout@v6
        with:
          repository: "azriel91/peace"
          path: "peace"

      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: "Install `wasm-pack`"
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: "Install Graphviz"
        uses: ts-graphviz/setup-graphviz@v1

      # install mdbook
      - name: mdbook cache restore
        id: mdbook_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook

      # use custom version of mdbook for now
      - name: Install `mdbook`
        run: cargo install mdbook --git https://github.com/azriel91/mdBook.git --branch improvement/code-blocks
        if: steps.mdbook_cache_restore.outputs.cache-hit != 'true'

      - name: mdbook cache save
        id: mdbook_cache_save
        uses: actions/cache/save@v4
        if: always() && steps.mdbook_cache_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook

      # install mdbook-graphviz
      - name: mdbook-graphviz cache restore
        id: mdbook_graphviz_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/mdbook-graphviz
          key: ${{ runner.os }}-mdbook-graphviz

      - run: cargo install --locked mdbook-graphviz
        if: steps.mdbook_graphviz_cache_restore.outputs.cache-hit != 'true'

      - name: mdbook-graphviz cache save
        id: mdbook_graphviz_cache_save
        uses: actions/cache/save@v4
        if: always() && steps.mdbook_graphviz_cache_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/mdbook-graphviz
          key: ${{ runner.os }}-mdbook-graphviz

      # build WASM examples
      #
      # Backtrack 3 layers of directories relative to example dir:
      #
      # * examples
      # * peace (repo)
      # * github agent dir
      - name: "Build WASM examples"
        working-directory: peace
        run: |
          for example in download
          do wasm-pack build \
            --target web \
            --out-dir "../../doc/src/examples/pkg" \
            --release \
            "examples/${example}" \
            --features 'error_reporting'
          done

      # Build and publish book
      #
      # Backtrack 2 layers of directories relative to `doc` directory:
      #
      # * peace (repo)
      # * github agent dir
      - name: Build book
        working-directory: peace_website
        run: mdbook build ../peace/doc -d ../../peace_website/static/book

      # We *do* want to include the built wasm files.
      - name: "Remove WASM artifacts .gitignore"
        working-directory: peace_website
        run: rm -f ./static/book/examples/pkg/.gitignore

      - name: "Build zola site and deploy"
        uses: shalzz/zola-deploy-action@v0.21.0
        env:
          BUILD_DIR: peace_website
          PAGES_BRANCH: gh-pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # github's line number anchors aren't explicitly named on the pages
          # causing zola's checks to fail
          #
          # CHECK_LINKS: true
